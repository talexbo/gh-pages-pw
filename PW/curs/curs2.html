<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <title>Curs 2: Ce nu am mai făcut.</title>
</head>

<body>
    <h1>Tabele</h1>
    <hr>
    <pre>Lorem         ipsum.</pre>
    <PRE>Lorem         ipsum.</PRE>
    <p>
        HTML is <mark>fun to learn</mark>.
    </p>
    <p>H<sub>2</sub>O</p>
    <p style="color:tomato;"><del>blue</del></p>
    <p style="background-color: rgb(0 0 255 / 1)";> Negru pe albastru</p>
    <p style="color:#fff">Text alb.</p>
    <p style="color:hsl(0, 100%, 0%)">Text negru.</p>
    <p style="color:hsla(0, 100%, 0%, 0.5)">Text negru alpha = 0.5</p>
    <ul style="list-style-type: square;">
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ul>
    <h2>Tabele</h2>
    <hr>
    <table border="10px" style="width:100%"> <!--Tagul pentru tabele este <table>/ width:100% intinde tabelul pe toata pagina
        si este "web responsive"-->
        <tr border="10px"> <!--linie de tabel-->
            <th style="width:50%">Antet 1</th> <!--Table header/antet-->
            <th>Antet 2</th>
            <th>Antet 3</th>
        </tr>
        <tr>
            <td>cel 1</td> <!--Table division-->
            <td>cel 2</td>
            <td>cel 3</td>
        </tr>
    </table>
</body>
</html>
