<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Exercițiul 1 – Orarul săptămânii</title>
  <link rel="stylesheet" href="ex1.css">
</head>
<body>
  <h1>Exercițiul 1 – Orarul săptămânii</h1>

  <!-- TODO 1: pune titlul tabelului cu <caption>, rândul de antet în <thead>
       și celelalte rânduri în <tbody>. Adaugă scope="col" pe antetele de coloană
       (Ora, Luni, Marți, Miercuri) și scope="row" pe antetele de rând (orele).
       TODO 2: ultimul rând are aceeași celulă de trei ori. Lasă o singură celulă
       "Pauză de masă" și unește-o pe cele 3 coloane cu colspan.
       TODO 3: "Programare web" apare pe două rânduri. Păstreaz-o o singură dată,
       în primul rând, și unește-o pe 2 rânduri cu rowspan. Șterge celula duplicat. -->
  <table>
    <caption>Orarul săptămânii</caption>
    <thead>
    <tr>
      <th scope="col">Ora</th>
      <th scope="col">Luni</th>
      <th scope="col">Marți</th>
      <th scope="col">Miercuri</th>
    </tr>
    </thead>
    <tr>
      <th scope="row">8:00–10:00</th>
      <td scope="row" rowspan="2">Programare web</td>
      <td scope="row">Matematică</td>
      <td scope="row">Engleză</td>
    </tr>

    <tr>
      <th scope="row">10:00–12:00</th>
      <td scope="row">Algoritmi</td>
      <td scope="row">Sport</td>
    </tr>
    <tr>
      <th>12:00–13:00</th>
      <td colspan="3" class="pauza">Pauză de masă</td>
    </tr>
  </table>
</body>
</html>
